apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// Using project.ext properties for root paths and SDK versions
def projectRoot = rootProject.projectDir.getParentFile().getAbsolutePath()

react {
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"].execute(null, rootDir).text.trim())
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile()
    hermesCommand = reactNativeDir.path + "/sdks/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile()

    // Use Expo CLI to bundle the app.
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"
}

def enableProguardInReleaseBuilds = findProperty('android.enableProguardInReleaseBuilds')?.toBoolean() ?: false

def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.nativeapp"
    defaultConfig {
        applicationId 'com.phpjrdev1.nativeapp'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            shrinkResources findProperty('android.enableShrinkResourcesInReleaseBuilds')?.toBoolean() ?: false
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            crunchPngs findProperty('android.enablePngCrunchInReleaseBuilds')?.toBoolean() ?: true
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging findProperty('expo.useLegacyPackaging')?.toBoolean() ?: false
        }
    }

    // Dynamically apply packaging options
    ["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
        def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",").collect { it.trim() }.findAll { it }
        if (options) {
            options.each { android.packagingOptions[prop] += it }
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    def isGifEnabled = findProperty('expo.gif.enabled')?.toBoolean() ?: false
    def isWebpEnabled = findProperty('expo.webp.enabled')?.toBoolean() ?: false
    def isWebpAnimatedEnabled = findProperty('expo.webp.animated')?.toBoolean() ?: false

    if (isGifEnabled) {
        implementation("com.facebook.fresco:animated-gif:${reactAndroidLibs.versions.fresco.get()}")
    }
    if (isWebpEnabled) {
        implementation("com.facebook.fresco:webpsupport:${reactAndroidLibs.versions.fresco.get()}")
        if (isWebpAnimatedEnabled) {
            implementation("com.facebook.fresco:animated-webp:${reactAndroidLibs.versions.fresco.get()}")
        }
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: new File(["node", "--print", "require.resolve('@react-native-community/cli-platform-android/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim(), "../native_modules.gradle")
applyNativeModulesAppBuildGradle(project)
